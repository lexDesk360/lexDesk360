<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">

    <title>Join Us International </title>
    <link rel="stylesheet" href="./css/global.css">

<body id="body">
    <div id="loading">
        <div class="spinner"></div>
    </div>
    <div id="content">
        <div class="container-bg">
            <div id="navbar"></div>
            <div class="opacityDiv">
                <div class="path">
                    <p class="path-page">
                        <span class="cursor" onclick="getHome()" data-translate="pathPage"></span>
                        |
                        <span data-translate="titlePage"></span></p>
                    <p class="title-page" data-translate="titlePage"></p>
                </div>
            </div>

        </div>
        <div id="services-content">
            <div class="group">
                <div class="w30f">
                    <div class="tabs">
                        <div class="tab active" onclick="openTab('tab1')" data-translate="tab1-title"></div>
                        <div class="tab w25f" onclick="openTab('tab2')" data-translate="tab2-title"></div>
                        <div class="tab" onclick="openTab('tab3')" data-translate="tab3-title"></div>
                        <div class="tab" onclick="openTab('tab4')" data-translate="tab4-title"></div>
                        <div class="tab" onclick="openTab('tab5')" data-translate="tab5-title"></div>

                    </div>
                </div>
                <div class="w65f">
                    <div class="content">
                        <div id="tab1" class="tab-content active">
                            <div id="dataItem1">
                            </div>
                            <div class="big-title">
                                <p data-translate="t1"></p>
                            </div>
                            <form class="form" id="Counsel">
                                <div class="group-inputs">
                                    <input type="text" class="input-feild name" data-translate="name" placeholder="Name"
                                        name="name" id="name1" autocomplete="off">
                                    <p class="error" id="errorname1"></p>
                                    <input type="text" class="input-feild" data-translate="email" placeholder="Email"
                                        name="email" id="email1" autocomplete="off">
                                    <p class="error" id="erroremail1"></p>
                                    <input type="text" class="input-feild" data-translate="phone" placeholder="Phone"
                                        name="phoneNumber" id="phone1" max="20" autocomplete="off">
                                    <p class="error" id="errorphone1"></p>
                                    <div class="resume">
                                        <div id="iconUpload1" class="resume-icon cursor"></div>
                                        <div class="text">
                                            <input class="none" id="file1" type="file" name="resume"
                                                accept=".pdf, .doc, .docx, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                                            <p data-translate="UploadProfile">Attached Resume</p>
                                            <p class="type" data-translate="fileTypes">PDF, DOC, DOCX, Max size 5MB</p>
                                            <p class="type" id="fileName1"></p>
                                        </div>
                                    </div>
                                    <p class="error" id="errorfile1"></p>

                                </div>
                                <div class="group-inputs">
                                    <input type="text" class="input-feild" placeholder="Posion" data-translate="Posion"
                                        id="position1" autocomplete="off">
                                    <p class="error" id="errorposition1"></p>
                                    <textarea class="input-feild textarea custom-note" name="message"
                                        data-translate="Notes" placeholder="Notes" id="notes1"
                                        autocomplete="off"></textarea>
                                    <input type="text" class="input-feild" data-translate="linkedIn"
                                        placeholder="linkedIn" id="linkedIn1" autocomplete="off">
                                    <p class="error" id="errorlinkedIn1"></p>
                                    <button type="submit">
                                        <p id="submitText1" data-translate="applyNow" class="cursor"></p>
                                    </button>

                                </div>
                            </form>
                            <div id="message1"></div>

                        </div>

                                    <button type="submit">

                                    </button>


                                </div>
                            </form>
